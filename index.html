<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Casamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bad+Script&family=Ballet:opsz@16..72&family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Island+Moments&family=Lavishly+Yours&family=Nothing+You+Could+Do&family=Parisienne&family=Playwrite+HU:wght@100..400&display=swap" rel="stylesheet">


  <style>
  

    body {
      @font-face {
  font-family: 'LeJourScript';
  src: url('Le Jour Script Personal Use Only.otf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif, cursive;
      background-color: #f8f5f0;
      overflow: hidden;
    }

    /* Fundo animado */
    .fundo {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      display: flex;
      animation: mover 25s linear infinite;
      z-index: 0;
    }

    .fundo img {
      width: 50%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6; /* realce das fotos */
      filter: brightness(0.9) contrast(1.1);
    }

    @keyframes mover {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* Sobreposição */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.4); /* mais leve para realçar as fotos */
      z-index: 1;
    }

    /* Conteúdo do convite */
    .convite {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 50px 20px;
      color: #3b2c20;
    }

 .convite h1 {
  font-family: 'Parisienne', cursive;
  font-size: 3.5rem;
  font-weight: 100; /* deixa bem fina */
  letter-spacing: -3px; /* ajusta espaçamento entre letras */
  margin-bottom: 10px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.973);
  color: #f7f4f3;
}

    .convite h2 {
     font-size: 1.1rem;
      margin: 20px auto;
      line-height: 1.6;;
      margin-bottom: 30px;
      color: #54582f;
    }

    .detalhes {
      font-size: 1.1rem;
      margin: 20px auto;
      line-height: 1.6;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.7);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

     .btn {
      display: inline-block;
      padding: 15px 30px;
      background: #54582f;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #54582f;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- Fundo animado -->
  <div class="fundo">
    <img src="segurandoamaodela.jpeg" alt="Fundo">
    <img src="segurando balao2.jpeg" alt="Fundo">
    <img src="fotosegurandobalao.jpeg" alt="Fundo">
    <img src="WhatsApp Image 2025-09-06 at 14.29.36.jpeg" alt="Fundo">
  </div>
  <div class="overlay"></div>

  <!-- Convite -->
  <div class="convite">
    <h1>Sarah & Eduardo</h1>
    <p>Quem diria que um namoro de brincadeira no dia da mentira ia acabar virando altar de verdade? 😅💍 Pois é… vamos nos casar</p>

    <div class="detalhes">
      <p><strong>Data:</strong> 25 de Outubro de 2025</p>
      <p><strong>Horário:</strong> 09h00 da manhã</p>
      <p><strong>Local:</strong> Av. Dona Cherubina Viana 1206</p>
     
    </div>

    <a href="pagina.html" class="btn">Aceita esse Convite?</a>
  </div>

  
</body>
</html>
